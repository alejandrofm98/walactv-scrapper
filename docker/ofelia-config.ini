[job-exec "futbol-daily"]
schedule = 0 0 8 * * *
container = __SCRAPPER_PREFIX__-futboltv
command = python main.py
no-overlap = true

[job-exec "iptv-sync"]
schedule = @every 6h
container = __SCRAPPER_PREFIX__-sync-iptv
command = /app/run-sync.sh
no-overlap = true

# Clasificacion Torrentio: has_torrent_source + torrent_languages por titulo.
# Repartido en 6 tandas diarias de 500 titulos (3000/dia) para no martillar
# Torrentio desde una sola pasada larga.
[job-exec "torrentio-classify-1"]
schedule = 0 0 3 * * *
container = __SCRAPPER_PREFIX__-sync-iptv
command = python iptv_scrapper/classify_torrentio.py --batch-size 500
no-overlap = true

[job-exec "torrentio-classify-2"]
schedule = 0 0 7 * * *
container = __SCRAPPER_PREFIX__-sync-iptv
command = python iptv_scrapper/classify_torrentio.py --batch-size 500
no-overlap = true

[job-exec "torrentio-classify-3"]
schedule = 0 0 11 * * *
container = __SCRAPPER_PREFIX__-sync-iptv
command = python iptv_scrapper/classify_torrentio.py --batch-size 500
no-overlap = true

[job-exec "torrentio-classify-4"]
schedule = 0 0 15 * * *
container = __SCRAPPER_PREFIX__-sync-iptv
command = python iptv_scrapper/classify_torrentio.py --batch-size 500
no-overlap = true

[job-exec "torrentio-classify-5"]
schedule = 0 0 19 * * *
container = __SCRAPPER_PREFIX__-sync-iptv
command = python iptv_scrapper/classify_torrentio.py --batch-size 500
no-overlap = true

[job-exec "torrentio-classify-6"]
schedule = 0 0 23 * * *
container = __SCRAPPER_PREFIX__-sync-iptv
command = python iptv_scrapper/classify_torrentio.py --batch-size 500
no-overlap = true

[job-exec "sync-replays"]
schedule = 0 0 12 * * *
container = __SCRAPPER_PREFIX__-sync-replays
command = python iptv_scrapper/sync_replays.py
no-overlap = true

[job-exec "tmdb-metadata-sync"]
schedule = 0 30 3,9,15,21 * * *
container = __SCRAPPER_PREFIX__-sync-tmdb-metadata
command = python iptv_scrapper/scrape_tmdb_metadata.py --batch-size 100
no-overlap = true

# Importa contenido trending de TMDB aunque no exista en la playlist IPTV.
[job-exec "tmdb-catalog-import"]
schedule = 0 0 2 * * *
container = __SCRAPPER_PREFIX__-sync-tmdb-metadata
command = python iptv_scrapper/import_tmdb_catalog.py --media-type both --pages 1
no-overlap = true

# Clasifica el catalogo consultando Torrentio (idiomas y disponibilidad).
# Corre a las 02:30 tras el import de catalogo y a las 14:30 como refresh.
[job-exec "torrentio-classify"]
schedule = 0 30 2,14 * * *
container = __SCRAPPER_PREFIX__-sync-tmdb-metadata
command = python iptv_scrapper/classify_torrentio.py --batch-size 50 --refresh-days 7
no-overlap = true

# IMDb ratings: 06:00 UTC daily (separado de tmdb-metadata 03:30/09:30/15:30/21:30 para evitar contention)
[job-exec "imdb-ratings"]
schedule = 0 0 6 * * *
container = __SCRAPPER_PREFIX__-imdb-ratings
command = python iptv_scrapper/import_imdb_ratings.py --batch-size 10000
no-overlap = true

# IMDb episode imdb_ids: 06:30 UTC daily (after imdb-ratings @ 06:00 to leave time for the ratings job to finish)
[job-exec "imdb-episode-ids"]
schedule = 0 30 6 * * *
container = __SCRAPPER_PREFIX__-imdb-episode-ids
command = python iptv_scrapper/populate_episode_imdb_ids.py --batch-size 5000
no-overlap = true

# IntroDB segments: 07:00 UTC, after episode IMDb IDs. Enable with INTRODB_SYNC_ENABLED=true.
[job-exec "introdb-segments"]
schedule = 0 0 7 * * *
container = __SCRAPPER_PREFIX__-sync-tmdb-metadata
command = sh -c 'if [ "$INTRODB_SYNC_ENABLED" = "true" ]; then python iptv_scrapper/sync_introdb_segments.py; else echo "IntroDB sync disabled"; fi'
no-overlap = true

[job-exec "tmdb-trending"]
schedule = 0 0 6,18 * * *
container = __SCRAPPER_PREFIX__-tmdb-trending
command = python iptv_scrapper/scrape_tmdb_trending.py
no-overlap = true
